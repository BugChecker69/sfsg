<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>かつしか郷土かるたのページ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      color: #333333;
      line-height: 1.5;
      background-color: #8cbbe7;
    }

    /* Toolsに戻るリンク */
    .back-nav {
      max-width: 1100px;
      margin: 0 auto;
      padding: 12px 20px 0;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      color: #1a62a5;
      text-decoration: none;
      padding: 6px 12px;
      background-color: rgba(255, 255, 255, 0.9);
      border: 1px solid #e2e8f0;
      border-radius: 9999px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      transition: background-color 0.2s, color 0.2s, transform 0.1s;
    }

    .back-link:hover {
      background-color: #ffffff;
      color: #0f4c81;
      transform: translateX(-2px);
    }

    /* 最上部ストライプ帯 */
    .top-stripe {
      height: 18px;
      background: repeating-linear-gradient(
        90deg,
        #2b6cb0 0,
        #2b6cb0 12px,
        #ffffff 12px,
        #ffffff 24px
      );
    }

    /* 白背景のヘッダー領域 */
    .header-area {
      background-color: #ffffff;
      padding: 16px 20px 20px;
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
    }

    .header-title {
      font-size: 1.8rem;
      font-weight: bold;
      color: #1a62a5;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    .header-desc {
      flex: 1;
      max-width: 620px;
      min-width: 280px;
    }

    .header-desc h2 {
      font-size: 0.85rem;
      color: #1a62a5;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .header-desc p {
      font-size: 0.8rem;
      color: #333333;
      line-height: 1.6;
    }

    /* 濃い青のアクセントバー */
    .nav-bar {
      height: 36px;
      background-color: #3b6d9e;
    }

    /* かるたコンテンツ領域 */
    .main-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    .center-logo {
      text-align: center;
      margin-bottom: 24px;
    }

    .center-logo img {
      max-width: 100%;
      height: auto;
    }

    /* かるたグリッドレイアウト */
    .karuta-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    @media (max-width: 900px) {
      .karuta-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      .karuta-grid {
        grid-template-columns: 1fr;
      }
    }

    /* かるたカード */
    .karuta-card {
      background-color: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(59, 109, 158, 0.4);
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card-text {
      width: 100%;
      font-size: 0.85rem;
      color: #1a2d42;
      font-weight: 500;
      margin-bottom: 10px;
      min-height: 40px;
      line-height: 1.4;
      text-align: left;
    }

    .card-img {
      width: 100%;
      max-width: 198px;
      display: flex;
      justify-content: center;
    }

    .card-img img {
      width: 100%;
      height: auto;
      aspect-ratio: 198 / 262;
      object-fit: cover;
      border: 1px solid rgba(0, 0, 0, 0.1);
    }

    /* フッター領域 */
    footer {
      text-align: center;
      padding: 32px 16px 48px;
    }

    .footer-logo img {
      max-width: 100%;
      height: auto;
      display: inline-block;
    }
  </style>
</head>
